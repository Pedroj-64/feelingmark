services:
  feelingmark:
    image: ghcr.io/pedroj-64/feelingmark:latest
    build: .
    ports:
      - "8787:8787"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      # VIDEO_MUSIC_FILE: /data/musica.mp3   # copia tu audio dentro de DATA_DIR
      AUTH_TOKEN: ${AUTH_TOKEN:?define AUTH_TOKEN en .env / set AUTH_TOKEN in .env}
    volumes:
      # Cambia la parte izquierda por tu disco, p. ej. /mnt/mi-disco/feelingmark
      # Change the left side to your own disk, e.g. /mnt/my-disk/feelingmark
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
