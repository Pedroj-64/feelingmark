name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG has this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FEELINGMARK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FEELINGMARK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FEELINGMARK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export FEELINGMARK_KEYSTORE="$RUNNER_TEMP/release.jks"
          # un APK por arquitectura (~50 MB) y uno universal (~116 MB) para quien no sepa cuál elegir
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            if [ "$abi" = universal ]; then arch=arm64-v8a,armeabi-v7a,x86,x86_64; else arch=$abi; fi
            ./gradlew clean assembleRelease --no-daemon -PreactNativeArchitectures=$arch # clean: que no arrastre librerías de otra arquitectura
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/feelingmark-${GITHUB_REF_NAME}-$abi.apk"
          done
      - name: Verify the APK is not signed with the debug key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for f in feelingmark-*.apk; do "$APKSIGNER" verify --print-certs "$f"; done | tee cert.txt
          ! grep -q "Android Debug" cert.txt
          sha256sum feelingmark-*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            feelingmark-*.apk
            SHA256SUMS.txt

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64 # Raspberry Pi
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" feelingmark-*.apk SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
